server {
    listen 80;
    server_name _;

    # ── Website (landing page + wiki) ──────────────────────────
    root /usr/share/nginx/html/website;
    index index.html;

    # ── Demo app (localStorage-only, no backend required) ──────
    location /demo/ {
        alias /usr/share/nginx/html/demo/;
        index index.html;
        try_files $uri $uri/ /demo/index.html;
    }

    # ── Full Labby app (server-side persistent storage) ────────
    location /app/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # ── API backend ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://labby-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # ── SSO: forward auth headers from your reverse proxy ──
        # Compatible with oauth2-proxy, Authentik, Keycloak, Authelia
        proxy_set_header   X-Auth-Request-User   $http_x_auth_request_user;
        proxy_set_header   X-Auth-Request-Email  $http_x_auth_request_email;
        proxy_set_header   Authorization         $http_authorization;

        proxy_read_timeout 30s;
    }

    # ── Website fallback ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

