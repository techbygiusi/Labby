<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labby - Map Your Homelab</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <img src="logo.svg" alt="Labby logo" class="logo" />
        <div>
        <h1>Labby - Map Your Homelab</h1>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="config-toggle" class="button secondary" type="button">⚙️ Config</button>
        <button id="theme-toggle" class="button secondary" aria-label="Toggle theme">🌙 Dark</button>
      </div>
    </header>

    <main class="phone-grid">
      <section class="phone panel-left">
        <h2 id="form-title">Add Resource</h2>
        <form id="resource-form" class="stack">
          <label>
            Type
            <select id="type" required>
              <option value="hardware">Hardware</option>
              <option value="vm">VM</option>
              <option value="lxc">LXC</option>
              <option value="app">App</option>
              <option value="network">Network</option>
            </select>
          </label>
          <label>
            Name
            <input id="name" type="text" placeholder="e.g. Proxmox Node" required />
          </label>
          <label id="symbol-wrap">
            Symbol / Icon (emoji or short text)
            <input id="symbol" type="text" maxlength="3" placeholder="e.g. 🖥️" />
          </label>
          <label id="hardware-kind-wrap">
            Hardware Type
            <select id="hardware-kind">
              <option value="server">Server</option>
              <option value="hypervisor">Hypervisor</option>
              <option value="nas">NAS</option>
              <option value="backup">Backup</option>
              <option value="pc">PC</option>
              <option value="router-gateway">Router / Gateway</option>
              <option value="switch">Switch</option>
            </select>
          </label>
          <label id="manufacturer-wrap">
            Manufacturer
            <input id="manufacturer" type="text" placeholder="e.g. Dell, Ubiquiti, Synology" />
          </label>
          <label id="os-wrap">
            Operating System (Hardware/VM/LXC)
            <input id="os" type="text" placeholder="e.g. Debian 12, Proxmox VE 8" />
          </label>
          <label>
            Description
            <input id="description" type="text" placeholder="Short note" />
          </label>
          <label id="notes-wrap">
            Notes
            <textarea id="notes" rows="3" placeholder="Any details, credentials location, maintenance info..."></textarea>
          </label>
          <label>
            IP Address (Hardware/VM/LXC)
            <input id="ip-address" type="text" placeholder="e.g. 192.168.10.20" />
          </label>
          <fieldset id="compute-fields" class="network-fields">
            <legend>Compute details</legend>
            <label>
              CPU count
              <input id="cpu-count" type="text" placeholder="e.g. 8" />
            </label>
            <fieldset id="ram-modules-wrap" class="network-fields nested-fields">
              <legend>RAM modules</legend>
              <div id="ram-modules" class="stack"></div>
              <button id="add-ram-module" class="button secondary" type="button">+ Add RAM module</button>
            </fieldset>
            <fieldset id="disk-list-wrap" class="network-fields nested-fields">
              <legend>Disks</legend>
              <div id="disk-list" class="stack"></div>
              <button id="add-disk" class="button secondary" type="button">+ Add Disk</button>
            </fieldset>
          </fieldset>
          <label id="switch-ports-wrap" class="hidden">
            Number of ports (Switch)
            <input id="switch-ports" type="number" min="1" placeholder="e.g. 24" />
          </label>
          <label id="router-switches-wrap" class="hidden">
            Connected switches
            <select id="router-switches" multiple></select>
          </label>
          <label id="switch-links-wrap" class="hidden">
            Connected switches
            <select id="switch-links" multiple></select>
          </label>
          <label id="switch-device-links-wrap" class="hidden">
            Connected hardware devices
            <select id="switch-device-links" multiple></select>
          </label>
          <fieldset id="nas-shares-wrap" class="network-fields hidden">
            <legend>NAS shares</legend>
            <div id="nas-shares" class="stack"></div>
            <button id="add-share" class="button secondary" type="button">+ Add Share</button>
          </fieldset>
          <fieldset id="nas-raids-wrap" class="network-fields hidden">
            <legend>NAS RAID groups</legend>
            <div id="nas-raids" class="stack"></div>
            <button id="add-raid" class="button secondary" type="button">+ Add RAID</button>
          </fieldset>
          <label id="ip-port-wrap" class="hidden">
            IP + Port (App)
            <input id="ip-port" type="text" placeholder="e.g. 10.10.0.50:3000" />
          </label>
          <label id="web-url-wrap" class="hidden">
            Web URL (App)
            <input id="web-url" type="url" placeholder="https://app.example.local" />
          </label>
          <label id="hosted-on-wrap">
            Hosted on (Hardware)
            <select id="hosted-on">
              <option value="">Not set</option>
            </select>
          </label>
          <label id="app-hosted-on-wrap" class="hidden">
            Hosted on (VM/LXC)
            <select id="app-hosted-on">
              <option value="">Not set</option>
            </select>
          </label>
          <fieldset id="network-fields" class="network-fields">
            <legend>Network details</legend>
            <label>
              Subnet (CIDR)
              <input id="subnet" type="text" placeholder="e.g. 192.168.10.0/24" />
            </label>
            <label>
              Gateway
              <input id="gateway" type="text" placeholder="e.g. 192.168.10.1" />
            </label>
            <div>
              <p class="mini-title">Subnet color</p>
              <div id="network-color-picker" class="color-picker"></div>
            </div>
          </fieldset>
          <div class="actions">
            <button id="save-btn" class="button" type="submit">Add item</button>
            <button id="cancel-edit" class="button secondary hidden" type="button">Cancel</button>
          </div>
        </form>
      </section>

      <section class="phone panel-center">
        <div class="panel-head">
          <h2>Topology</h2>
          <button id="seed-demo" class="button secondary" type="button">Load Demo</button>
        </div>
        <div class="filters">
          <input id="search" type="search" placeholder="Search..." />
          <select id="filter-type">
            <option value="all">All types</option>
            <option value="hardware">Hardware</option>
            <option value="vm">VM</option>
            <option value="lxc">LXC</option>
            <option value="app">App</option>
            <option value="network">Network</option>
          </select>
        </div>
        <div id="stats" class="stats"></div>
        <div id="boards" class="boards"></div>
      </section>

    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <button id="ip-toggle" class="ip-toggle" type="button">🌐 IP View</button>
    <button id="tree-toggle" class="tree-toggle" type="button">🌳 Tree View</button>

    <dialog id="ip-dialog" class="tree-dialog">
      <div class="tree-head">
        <h3>IP Address View</h3>
        <button id="ip-close" class="icon-btn" type="button">Close</button>
      </div>
      <div class="ip-search-bar">
        <input id="ip-search" type="text" placeholder="Search IP or hostname..." autocomplete="off" />
      </div>
      <div id="ip-content" class="tree-content"></div>
    </dialog>

    <dialog id="tree-dialog" class="tree-dialog">
      <div class="tree-head">
        <h3>Relationship Tree</h3>
        <div class="tree-head-actions">
          <div class="view-switch" role="tablist" aria-label="Tree view mode">
            <button id="tree-mode-tree" class="icon-btn active" type="button">Tree</button>
            <button id="tree-mode-graph" class="icon-btn" type="button">Graph</button>
          </div>
          <button id="tree-close" class="icon-btn" type="button">Close</button>
        </div>
      </div>
      <div id="tree-content" class="tree-content"></div>
    </dialog>

    <dialog id="config-dialog" class="tree-dialog">
      <div class="tree-head">
        <h3>Config</h3>
        <button id="config-close" class="icon-btn" type="button">Close</button>
      </div>
      <p class="note">Backup or move your full homelab map.</p>
      <div class="stack">
        <button id="export-btn" class="button secondary" type="button">Export Config</button>
        <label class="button secondary file-label">
          Import Config
          <input id="import-file" type="file" accept="application/json" />
        </label>
        <button id="clear-all" class="button danger" type="button">Clear All</button>
      </div>
      <div class="legend">
        <p><span class="dot hardware"></span> Hardware</p>
        <p><span class="dot vm"></span> VM</p>
        <p><span class="dot lxc"></span> LXC</p>
        <p><span class="dot app"></span> App</p>
        <p><span class="dot network"></span> Network</p>
      </div>
    </dialog>

    <template id="item-template">
      <article class="card">
        <div class="card-head">
          <div class="title-wrap">
            <span class="type-badge"></span>
            <h3 class="card-title"></h3>
          </div>
          <div class="card-controls">
            <button class="icon-btn edit-btn" type="button">Edit</button>
            <button class="icon-btn delete-btn" type="button">Delete</button>
          </div>
        </div>
        <p class="card-desc"></p>
        <p class="card-notes"></p>
        <p class="card-ip"></p>
        <p class="card-app"></p>
        <p class="card-specs"></p>
        <p class="card-network"></p>
        <p class="card-hosting"></p>
        <p class="card-links"></p>
      </article>
    </template>

    <a
      class="github"
      href="https://github.com/techbygiusi/Labby"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open Labby on GitHub"
      title="Open on GitHub"
      >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52
          -.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07
          -1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21
          2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16
          1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
          0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span>GitHub</span>
    </a>

    <script src="script.js"></script>
  </body>
</html>
