<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labby Wiki</title>
  <meta name="description" content="Labby documentation -installation, features, rack view, IP view, themes and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:     #ece9df;
      --bg-b:   #d6ccc2;
      --panel:  #ffffff;
      --phone:  #f5f1e7;
      --text:   #202126;
      --muted:  #575a64;
      --line:   #2e2f36;
      --yellow: #f4d371;
      --mint:   #b8efca;
      --blue:   #b8d9ff;
      --shadow: 0 14px 28px rgba(22,25,36,.14);
    }
    [data-theme="dark"] {
      --bg:     #1e1828;
      --bg-b:   #15101e;
      --panel:  #2e2640;
      --phone:  #231d30;
      --text:   #ede6f5;
      --muted:  #9e8fb5;
      --line:   #5c4d7a;
      --yellow: #e8b4d8;
      --mint:   #352d48;
      --blue:   #38304c;
      --shadow: 0 16px 34px rgba(10,6,18,.65);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg-b);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .wiki-page { flex: 1; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--bg);
      --split: 22%;
      --cut: calc(100% - var(--split));
      --amp: 2.2%;
      clip-path: polygon(
        0% 0%, 100% 0%,
        100% calc(var(--cut) + var(--amp)*.35),
        92%  calc(var(--cut) + var(--amp)*.12),
        84%  calc(var(--cut) + var(--amp)*-.05),
        76%  calc(var(--cut) + var(--amp)*-.18),
        68%  calc(var(--cut) + var(--amp)*-.26),
        60%  calc(var(--cut) + var(--amp)*-.28),
        52%  calc(var(--cut) + var(--amp)*-.22),
        44%  calc(var(--cut) + var(--amp)*-.10),
        36%  calc(var(--cut) + var(--amp)*.05),
        28%  calc(var(--cut) + var(--amp)*.18),
        20%  calc(var(--cut) + var(--amp)*.27),
        12%  calc(var(--cut) + var(--amp)*.24),
        6%   calc(var(--cut) + var(--amp)*.12),
        0%   calc(var(--cut) + var(--amp)*-.05)
      );
      z-index: -1;
      pointer-events: none;
    }

    .wrap { width: min(90vw, 1100px); margin: 0 auto; }


    /* ── shared chrome sizing ── */
    body > nav {
      padding: 1.1rem 0;
    }
    body > nav > .wrap,
    body > footer > .wrap {
      min-height: 38px;
    }
    body > footer {
      padding: 1rem 0;
    }

    /* ── nav ── */
    nav {
      padding: 1rem 0;
      border-bottom: 3px solid var(--line);
      background: color-mix(in srgb, var(--phone) 92%, white);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      transition: background .25s ease, border-color .25s ease;
    }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .nav-brand { display: flex; align-items: center; gap: .65rem; text-decoration: none; }
    .nav-name { font: 700 1rem/1 'Space Mono', monospace; color: var(--text); }
    .nav-badge {
      font: 700 .68rem/1 'Space Mono', monospace;
      background: var(--yellow);
      border: 2px solid var(--line);
      border-radius: 6px;
      padding: .15rem .4rem;
      color: var(--text);
    }
    .nav-links { display: flex; gap: .5rem; }

    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      border: 2px solid var(--line); border-radius: 12px;
      padding: .48rem .9rem;
      font: 700 .82rem/1.2 'Space Mono', monospace;
      cursor: pointer; text-decoration: none;
      transition: transform .12s ease, box-shadow .12s ease;
      white-space: nowrap; color: var(--text);
    }
    .btn-secondary { background: var(--panel); }
    .btn-primary   { background: var(--yellow); }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .btn:active { transform: translateY(1px); box-shadow: none; }

    .theme-toggle {
      height: 34px; padding: 0 .7rem;
      border: 2px solid var(--line); border-radius: 10px;
      background: var(--panel); color: var(--text);
      font: 700 .75rem/1 'Space Mono', monospace;
      cursor: pointer; display: flex; align-items: center; gap: .3rem;
      transition: background .25s ease, border-color .25s ease, transform .12s ease;
    }
    .theme-toggle:hover { transform: translateY(-1px); }



    /* ── footer ── */
    footer {
      border-top: 3px solid var(--line);
      padding: 1rem 0;
      background: color-mix(in srgb, var(--phone) 92%, white);
      transition: background .25s ease, border-color .25s ease;
    }
    footer .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
    }
    .footer-text {
      font: 700 .72rem/1.4 'Space Mono', monospace;
      color: var(--muted);
    }
    .footer-text a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .footer-links { display: flex; gap: .5rem; }

    /* ── wiki layout ── */
    .wiki-page { padding: 2.5rem 0 4rem; }

    .wiki-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    .wiki-sidebar {
      position: sticky;
      top: 80px;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .wiki-nav { display: flex; flex-direction: column; gap: .1rem; }
    .wiki-nav-group { margin-bottom: .65rem; }
    .wiki-nav-heading {
      font: 700 .64rem/1 'Space Mono', monospace;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 .3rem; padding: 0 .5rem;
    }
    .wiki-nav-link {
      display: block; padding: .3rem .6rem;
      font: 600 .78rem/1.3 'Space Mono', monospace;
      color: var(--text); text-decoration: none;
      border-radius: 8px; border: 2px solid transparent;
      transition: background .12s ease;
    }
    .wiki-nav-link:hover { background: color-mix(in srgb, var(--yellow) 30%, transparent); }
    .wiki-nav-link.active { background: var(--yellow); border-color: var(--line); }

    /* ── content ── */
    .wiki-content {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 2rem 2.2rem;
      min-height: 420px;
      font-size: .9rem;
      line-height: 1.7;
      transition: background .25s ease, border-color .25s ease;
    }
    .wiki-content h1 { font: 700 1.4rem/1.2 'Space Mono', monospace; margin: 0 0 1.1rem; }
    .wiki-content h2 {
      font: 700 .95rem/1.2 'Space Mono', monospace;
      margin: 1.6rem 0 .55rem;
      padding-bottom: .3rem;
      border-bottom: 2px solid color-mix(in srgb, var(--line) 15%, transparent);
    }
    .wiki-content p  { margin: 0 0 .75rem; }
    .wiki-content ul, .wiki-content ol { margin: 0 0 .75rem 1.3rem; }
    .wiki-content li { margin-bottom: .25rem; }
    .wiki-pre-wrap { position: relative; margin: .65rem 0; }
    .wiki-content pre {
      background: var(--text); color: var(--bg);
      border-radius: 10px; padding: .85rem 3.2rem .85rem 1rem;
      font: 600 .76rem/1.5 'Space Mono', monospace;
      overflow-x: auto; border: 2px solid var(--line);
      margin: 0;
    }
    .wiki-copy-btn {
      position: absolute; top: .5rem; right: .5rem;
      border: 2px solid rgba(255,255,255,.2); border-radius: 7px;
      background: rgba(255,255,255,.1); color: #fff;
      font: 700 .68rem/1 'Space Mono', monospace;
      padding: .28rem .5rem; cursor: pointer;
      display: flex; align-items: center; gap: .25rem;
      transition: background .15s ease, transform .12s ease;
      white-space: nowrap;
    }
    .wiki-copy-btn:hover { background: rgba(255,255,255,.2); transform: translateY(-1px); }
    .wiki-copy-btn:active { transform: translateY(1px); }
    .wiki-copy-btn.copied { border-color: #b8efca; color: #b8efca; background: rgba(184,239,202,.12); }
    .wiki-content code {
      font-family: 'Space Mono', monospace; font-size: .82em;
      background: color-mix(in srgb, var(--line) 10%, transparent);
      padding: .1em .35em; border-radius: 4px;
    }
    .wiki-content pre code { background: none; padding: 0; font-size: inherit; }
    .wiki-content a { color: var(--text); font-weight: 700; }

    /* ── mobile FAB menu ── */
    .wiki-fab { display: none; }
    .wiki-drawer { display: none; }
    .wiki-drawer-overlay { display: none; }

    @media (max-width: 820px) {
      .wiki-layout { grid-template-columns: 1fr; }
      .wiki-sidebar { display: none; }
      .wiki-content { padding: 1.3rem 1.1rem; }

      .wiki-drawer { display: block; }

      /* floating menu button -right-side tab, vertically centred */
      .wiki-fab {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: .35rem;
        position: fixed;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        z-index: 200;
        width: 44px;
        padding: .75rem 0;
        border: 3px solid var(--line);
        border-right: none;
        border-radius: 14px 0 0 14px;
        background: var(--yellow);
        color: var(--text);
        font: 700 .68rem/1.2 'Space Mono', monospace;
        cursor: pointer;
        box-shadow: -4px 4px 18px rgba(0,0,0,.18);
        transition: transform .13s ease, box-shadow .13s ease;
      }
      .wiki-fab:hover { transform: translateY(-50%) translateX(-3px); box-shadow: -6px 6px 22px rgba(0,0,0,.22); }
      .wiki-fab:active { transform: translateY(-50%) translateX(1px); }

      /* drawer overlay */
      .wiki-drawer-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 190;
        background: rgba(0,0,0,.4);
      }
      .wiki-drawer-overlay.open { display: block; }

      /* drawer panel */
      .wiki-drawer {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 195;
        background: var(--phone);
        border-top: 3px solid var(--line);
        border-radius: 20px 20px 0 0;
        padding: 1.2rem 1.2rem 2rem;
        box-shadow: 0 -12px 40px rgba(0,0,0,.2);
        transform: translateY(100%);
        transition: transform .22s ease;
        max-height: 75vh;
        overflow-y: auto;
      }
      .wiki-drawer.open { transform: translateY(0); }

      .wiki-drawer-handle {
        width: 40px; height: 4px;
        background: var(--line);
        border-radius: 999px;
        margin: 0 auto .9rem;
        opacity: .35;
      }
      .wiki-drawer-title {
        font: 700 .72rem/1 'Space Mono', monospace;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: .75rem;
        display: block;
      }
      .wiki-drawer .wiki-nav-group { margin-bottom: .7rem; }
      .wiki-drawer .wiki-nav-heading {
        font: 700 .62rem/1 'Space Mono', monospace;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 .3rem;
        padding: 0 .4rem;
      }
      .wiki-drawer .wiki-nav-link {
        display: block;
        padding: .45rem .7rem;
        font: 600 .85rem/1.3 'Space Mono', monospace;
        color: var(--text);
        text-decoration: none;
        border-radius: 10px;
        border: 2px solid transparent;
        transition: background .12s ease;
      }
      .wiki-drawer .wiki-nav-link:hover { background: color-mix(in srgb, var(--yellow) 30%, transparent); }
      .wiki-drawer .wiki-nav-link.active { background: var(--yellow); border-color: var(--line); }
    }

    @media (max-width: 520px) {
      .btn-label { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="nav-brand" href="index.html">
      <span class="nav-name">Labby</span>
      <span class="nav-badge">Wiki</span>
    </a>
    <div class="nav-links">
      <a class="btn btn-secondary" href="index.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.75L12 3l9 6.75V21a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9.75z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span id="toggle-label" class="btn-label">Dark</span>
      </button>
    </div>
  </div>
</nav>

<div class="wiki-page">
  <div class="wrap">
    <div class="wiki-layout">
      <aside class="wiki-sidebar">
        <nav class="wiki-nav">
          <div class="wiki-nav-group">
            <p class="wiki-nav-heading">Getting Started</p>
            <a class="wiki-nav-link active" href="#" data-page="home">Home</a>

      <div class="wiki-content" id="wiki-content"></div>
    </div>

<script>
// ── theme toggle ──
const btn   = document.getElementById('theme-toggle');
const icon  = document.getElementById('toggle-icon');
const label = document.getElementById('toggle-label');
const html  = document.documentElement;
const MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const SUN  = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
function applyTheme(dark) {
  html.dataset.theme = dark ? 'dark' : '';
  icon.innerHTML = dark ? SUN : MOON;
  label.textContent = dark ? 'Light' : 'Dark';
}
applyTheme(localStorage.getItem('labby-site-theme') === 'dark');
btn.addEventListener('click', () => {
  const isDark = html.dataset.theme === 'dark';
  applyTheme(!isDark);
  localStorage.setItem('labby-site-theme', !isDark ? 'dark' : 'light');
});

// ── wiki pages ──
(function(){
  const PAGES = {
    home:{title:'🧪 Labby Wiki',content:`
      <p>Labby is a lightweight homelab inventory, rack and topology tool with persistent, browser-independent storage. Track your hardware, VMs, LXCs, apps, networks, rack layouts and relationships in one clean dashboard. Self-host it with Docker and keep your homelab map available from every browser and device.</p>
      <h2>Main Highlights</h2>
      <ul>
        <li>🖥️ Resource tracking for Hardware, VMs, LXCs, Apps and Networks</li>
        <li>🌐 Topology mapping with Tree and Graph relationship views</li>
        <li>🗄️ Rack View with locations, racks, front/rear layouts and device linking</li>
        <li>🎨 Built-in themes and custom theme editor</li>
        <li>🧠 Automatic network matching by IP/CIDR</li>
        <li>📡 Optional live checks for IP and URL status</li>
        <li>💾 Export / Import JSON backups including racks, themes and active theme</li>
        <li>📱 Mobile and tablet optimized full-screen views</li>
        <li>🗄️ Persistent server-side storage in the self-hosted version</li>
      </ul>
      <h2>Fast Start</h2>
      <pre>git clone https://github.com/techbygiusi/Labby.git
cd Labby
docker compose up --build -d</pre>
      <p>Open: <code>http://localhost:8080</code></p>
    `},
    installation:{title:'🚀 Installation',content:`
      <h2>Requirements</h2>
      <ul><li>Docker</li><li>Docker Compose</li></ul>
      <h2>Start Labby</h2>
      <pre>docker compose up --build -d</pre>
      <p>Open Labby in your browser: <code>http://localhost:8080</code></p>
      <h2>Stop Labby</h2>
      <pre>docker compose down</pre>
      <p>Data is preserved in Docker volume: <code>labby-data</code></p>
      <h2>Update Existing Installation</h2>
      <pre>cd ~/Labby
git pull
docker compose down
docker compose up --build -d</pre>
      <p>Check containers: <code>docker compose ps</code></p>
      <h2>Full Clean Rebuild</h2>
      <pre>cd ~/Labby
git pull
docker compose down --remove-orphans
docker compose build --no-cache
docker compose up -d</pre>
      <h2>Change Port</h2>
      <p>Edit <code>docker-compose.yml</code>:</p>
      <pre>ports:
  - "9090:80"</pre>
      <p>Then restart and open <code>http://localhost:9090</code></p>
    `},
    quickstart:{title:'🧭 Quick Start',content:`
      <p>A clean setup order keeps the map easy to understand.</p>
      <h2>1. Add Networks First</h2>
      <p>Create networks with name, subnet, gateway and color. Labby auto-matches IPs to subnets.</p>
      <pre>Core LAN
192.168.10.0/24
Gateway: 192.168.10.1</pre>
      <h2>2. Add Hardware</h2>
      <p>Router, switch, hypervisor, server, NAS, backup, PC. Add OS, CPU, RAM, disks, IP, notes.</p>
      <h2>3. Add VMs and LXCs</h2>
      <p>Select the host they run on.</p>
      <pre>VM: docker-01
Hosted on: Proxmox Node 1</pre>
      <h2>4. Add Apps</h2>
      <pre>App: Portainer
IP:Port: 192.168.20.21:9000
Web URL: https://portainer.home.local
Hosted on: docker-01</pre>
      <h2>5. Use the Views</h2>
      <ul>
        <li><strong>IP View</strong> -all IPs sorted by subnet</li>
        <li><strong>Tree View</strong> -hosting relationships</li>
        <li><strong>Graph View</strong> -visual relationship map</li>
        <li><strong>Rack View</strong> -physical rack placement</li>
      </ul>
      <h2>6. Back Up Your Setup</h2>
      <pre>Config → Export Config</pre>
    `},
    features:{title:'✨ Features',content:`
      <h2>Core</h2>
      <ul>
        <li>🖥️ Resource tracking for Hardware, VMs, LXCs, Apps and Networks</li>
        <li>🌐 Topology mapping with Tree and Graph relationship views</li>
        <li>🗄️ Rack View with locations, racks, front/rear layouts and device linking</li>
        <li>🎨 Theme system with built-in themes and custom theme editor</li>
        <li>🧠 Automatic network matching by IP/CIDR</li>
        <li>🧭 Config tutorial built into the Config dialog</li>
        <li>💾 Persistent server-side storage saved in JSON on the backend</li>
      </ul>
      <h2>Resources and Metadata</h2>
      <p>OS, Manufacturer, CPU, RAM, Disks, Notes, Links, Web URLs, Status, Hosted-on relationships, Connected devices. Hardware types: Server, Router/Gateway, Switch, Hypervisor, NAS, Backup, PC.</p>
      <h2>Live Status</h2>
      <p>Online, Offline, Maintenance, Live IP check, Live URL check. For apps, IP:Port values like <code>192.168.20.21:9443</code> are supported -the live check extracts the host automatically.</p>
      <h2>Mobile and Desktop UX</h2>
      <p>Desktop: classic two-panel layout. Mobile/tablet: full-screen panels with bottom navigation (Topology, Add, IP View, Tree, Config).</p>
    `},
    rackview:{title:'🗄️ Rack View',content:`
      <p>Rack View lets you document the physical side of your homelab.</p>
      <h2>What Rack View Can Do</h2>
      <ul>
        <li>Create locations and racks</li>
        <li>Configure rack height units and form factor</li>
        <li>Build front and rear rack layouts</li>
        <li>Drag components into slots</li>
        <li>Link rack components to Labby resources</li>
        <li>Edit or delete racks through the context menu</li>
        <li>Export and import rack data with normal config backup</li>
      </ul>
      <h2>Supported Rack Components</h2>
      <ul>
        <li>1U / 2U / 4U servers, Multi-PC server rows</li>
        <li>Router, Switch, Patch panel</li>
        <li>Cable management, UPS, PDU, KVM, Blank panels</li>
      </ul>
      <h2>Typical Workflow</h2>
      <ol>
        <li>Open <strong>Rack View</strong></li>
        <li>Create a <strong>Location</strong></li>
        <li>Create a <strong>Rack</strong></li>
        <li>Open the Rack Editor</li>
        <li>Drag components into front or rear layout</li>
        <li>Link components to existing Labby resources</li>
      </ol>
    `},
    treegraph:{title:'🌳 Tree and Graph View',content:`
      <p>Labby provides two relationship views.</p>
      <h2>Tree View</h2>
      <p>Groups infrastructure by type and relationship. Shows hardware groups, hosts, VMs, LXCs, apps running on guests and unassigned resources.</p>
      <h2>Graph View</h2>
      <p>Visualizes relationships as connected bubbles.</p>
      <ul>
        <li>Auto-zoom on open</li>
        <li>Centers around the main component cluster</li>
        <li>Permanent node names below bubbles</li>
        <li>Hover shows <strong>Edit</strong> tooltip</li>
        <li>Clicking a bubble opens the resource editor</li>
      </ul>
      <h2>Relationship Examples</h2>
      <pre>Router → Switch → Hypervisor → VM → App</pre>
      <pre>NAS → Backup Server</pre>
    `},
    ipview:{title:'🌐 IP View',content:`
      <p>IP View shows all used addresses in one place.</p>
      <h2>Features</h2>
      <ul>
        <li>Dedicated IP overview sorted by subnet</li>
        <li>Network color coding</li>
        <li>Gateway and subnet awareness</li>
        <li>App port display</li>
        <li>Search by IP, hostname or port</li>
      </ul>
      <p>Example app entry: <code>192.168.20.21:2283</code></p>
      <h2>Best Practice</h2>
      <p>Add networks before adding devices. This allows Labby to match devices to the correct subnet automatically.</p>
    `},
    themes:{title:'🎨 Themes',content:`
      <p>Labby includes a theme system for the interface.</p>
      <h2>Built-in Themes</h2>
      <ul>
        <li>Light, Ocean, Forest, Rose, Solar</li>
        <li>Dark, Midnight, Carbon, Nord, Grape</li>
      </ul>
      <h2>Custom Themes</h2>
      <p>The custom theme editor lets you change background, panels, text, borders, accent buttons, info boxes, highlights, danger color and resource type colors.</p>
      <h2>Import and Export</h2>
      <p>Custom themes are included in config exports. The active theme is also saved and restored when importing a config.</p>
    `},
    config:{title:'💾 Config, Import and Export',content:`
      <p>Labby supports app-level JSON backup and restore.</p>
      <h2>Export Config</h2>
      <pre>Config → Export Config</pre>
      <p>The export includes: Resources, Locations, Racks, Custom themes, Active theme.</p>
      <h2>Import Config</h2>
      <pre>Config → Import Config</pre>
      <p>Supports current full JSON exports and older localStorage exports from previous Labby versions.</p>
      <h2>Config Tutorial</h2>
      <p>The Config dialog includes a short tutorial directly inside the dialog.</p>
    `},
    backup:{title:'🗄️ Data and Backup',content:`
      <p>The self-hosted version stores data server-side in a JSON file inside Docker volume <code>labby-data</code>.</p>
      <h2>Docker Volume Backup</h2>
      <p>Create a backup:</p>
      <pre>docker run --rm \\
  -v labby-data:/data \\
  -v $(pwd):/backup \\
  alpine tar czf /backup/labby-backup.tar.gz /data</pre>
      <p>Restore:</p>
      <pre>docker run --rm \\
  -v labby-data:/data \\
  -v $(pwd):/backup \\
  alpine tar xzf /backup/labby-backup.tar.gz -C /</pre>
      <h2>App-Level Backup</h2>
      <pre>Config → Export Config</pre>
      <p>Creates a JSON backup that can be imported later.</p>
    `},
  };

  const content = document.getElementById('wiki-content');
  const links   = document.querySelectorAll('.wiki-nav-link');

  function openDrawer()  { document.getElementById('wiki-drawer').classList.add('open'); document.getElementById('drawer-overlay').classList.add('open'); }
  function closeDrawer() { document.getElementById('wiki-drawer').classList.remove('open'); document.getElementById('drawer-overlay').classList.remove('open'); }

  const COPY_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const CHECK_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

  function wrapCodeBlocks() {
    content.querySelectorAll('pre').forEach(pre => {
      if (pre.parentNode.classList.contains('wiki-pre-wrap')) return;
      const wrap = document.createElement('div');
      wrap.className = 'wiki-pre-wrap';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      const btn = document.createElement('button');
      btn.className = 'wiki-copy-btn';
      btn.innerHTML = COPY_ICON + ' Copy';
      btn.addEventListener('click', () => {
        navigator.clipboard.writeText(pre.textContent).then(() => {
          btn.classList.add('copied');
          btn.innerHTML = CHECK_ICON + ' Copied!';
          setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = COPY_ICON + ' Copy'; }, 2000);
        });
      });
      wrap.appendChild(btn);
    });
  }

  function showPage(id) {
    const p = PAGES[id]; if (!p) return;
    content.innerHTML = '<h1>' + p.title + '</h1>' + p.content;
    wrapCodeBlocks();
    // update active on both sidebar and drawer
    document.querySelectorAll('.wiki-nav-link').forEach(l =>
      l.classList.toggle('active', l.dataset.page === id)
    );
  }

  // desktop sidebar
  links.forEach(l => l.addEventListener('click', e => { e.preventDefault(); showPage(l.dataset.page); }));

  showPage('home');

  // wire up FAB + drawer AFTER full DOM is ready
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('wiki-fab').addEventListener('click', openDrawer);
    document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

    // populate drawer nav by cloning sidebar groups
    const drawerNav = document.getElementById('drawer-nav');
    document.querySelectorAll('.wiki-sidebar .wiki-nav-group').forEach(group => {
      const clone = group.cloneNode(true);
      clone.querySelectorAll('.wiki-nav-link').forEach(l => {
        l.addEventListener('click', e => {
          e.preventDefault();
          showPage(l.dataset.page);
          closeDrawer();
        });
      });
      drawerNav.appendChild(clone);
    });
  });
})();
</script>
