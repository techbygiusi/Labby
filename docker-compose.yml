services:

  # ── Frontend (nginx: website + demo + app) ──────────────────
  labby-frontend:
    build:
      context: ..                               # parent Labby/ directory
      dockerfile: "Labby Neue Webseite/Dockerfile"
    container_name: labby-frontend
    ports:
      - "80:80"
    depends_on:
      - labby-backend
    restart: always

  # ── Backend (Node.js API) ────────────────────────────────────
  labby-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labby-backend
    environment:
      - DATA_DIR=/data

      # ── SSO settings ────────────────────────────────────────
      # Set AUTH_ENABLED=true to require authentication for all API calls.
      # When enabled the backend expects one of:
      #   • X-Auth-Request-User header  (oauth2-proxy / Authentik / Authelia)
      #   • Authorization: Bearer <jwt> (Keycloak / any OIDC provider)
      - AUTH_ENABLED=false

      # Name of the header carrying the authenticated username (default shown)
      - AUTH_USER_HEADER=X-Auth-Request-User

      # Optional: comma-separated list of allowed users (empty = allow all)
      - AUTH_ALLOWED_USERS=

    volumes:
      - labby-data:/data
    restart: always

volumes:
  labby-data:
    driver: local

